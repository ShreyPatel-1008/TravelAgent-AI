<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TravelAgent AI - Premium Travel Architect</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              space: {
                main: 'var(--space-main)',
                secondary: 'var(--space-secondary)',
                card: 'var(--space-card)',
                border: 'var(--space-border)',
              },
              brand: {
                primary: 'var(--brand-primary)',
                glow: 'var(--brand-glow)',
                tech: '#38BDF8',
                highlight: '#FACC15',
              },
              typo: {
                primary: 'var(--text-primary)',
                secondary: 'var(--text-secondary)',
                muted: 'var(--text-muted)',
              }
            },
            fontFamily: {
              sans: ['Plus Jakarta Sans', 'sans-serif'],
            },
            transitionProperty: {
              'theme': 'background-color, border-color, color, fill, stroke, box-shadow',
            }
          },
        },
      }
    </script>
    <style>
      :root {
        /* LIGHT MODE - SOFT OLIVE THEME */
        --space-main: #F7F9F3;
        --space-secondary: #EDF1E7;
        --space-card: #FFFFFF;
        --space-border: #DDE2D1;
        
        --brand-primary: #97A87A;
        --brand-glow: #B9C99F;
        
        --text-primary: #1F2933;
        --text-secondary: #4B5563;
        --text-muted: #9CA3AF;
        
        --glow-shadow: 0 0 15px rgba(151, 168, 122, 0.2);
      }

      .dark {
        /* DARK MODE - DEEP SPACE SAGE THEME */
        --space-main: #0B0F14;
        --space-secondary: #111827;
        --space-card: #161E2E;
        --space-border: #3A5F4B;
        
        --brand-primary: #97A87A; /* Applied as requested */
        --brand-glow: #B9C99F;    /* Luminous Sage variant */
        
        --text-primary: #E5E7EB;
        --text-secondary: #9CA3AF;
        --text-muted: #6B7280;
        
        --glow-shadow: 0 0 20px rgba(151, 168, 122, 0.35);
      }

      body {
        font-family: 'Plus Jakarta Sans', sans-serif;
        background-color: var(--space-main);
        color: var(--text-primary);
        overflow-x: hidden;
        transition: background-color 0.3s ease, color 0.3s ease;
      }

      .ai-glow {
        box-shadow: 0 0 10px rgba(151, 168, 122, 0.4), 0 0 30px rgba(151, 168, 122, 0.2);
      }
      .dark .ai-glow {
        box-shadow: 0 0 10px rgba(185, 201, 159, 0.4), 0 0 30px rgba(185, 201, 159, 0.25);
      }

      .card-deep {
        background: var(--space-card);
        border: 1px solid var(--space-border);
        transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      }

      .btn-primary {
        background: var(--brand-primary);
        color: var(--space-main);
        box-shadow: var(--glow-shadow);
        transition: all 0.3s ease;
      }
      .btn-primary:hover:not(:disabled) {
        background: var(--brand-glow);
        box-shadow: 0 0 30px rgba(185, 201, 159, 0.6);
        transform: translateY(-2px);
      }

      .chip-selected {
        background: linear-gradient(135deg, var(--brand-primary), var(--brand-glow));
        color: var(--space-main);
      }

      .staggered-entry {
        animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        opacity: 0;
      }
      @keyframes slideUp {
        from { transform: translateY(30px); opacity: 0; }
        to { transform: translateY(0); opacity: 1; }
      }

      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: var(--space-main);
      }
      ::-webkit-scrollbar-thumb {
        background: var(--space-border);
        border-radius: 10px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: var(--brand-primary);
      }
      
      .theme-transition * {
        transition: background-color 0.3s ease, border-color 0.3s ease, color 0.3s ease, box-shadow 0.3s ease !important;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
    "recharts": "https://esm.sh/recharts@^3.6.0"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body class="transition-colors duration-300">
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
